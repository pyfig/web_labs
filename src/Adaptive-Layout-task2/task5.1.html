<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задания по адаптивной верстке</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: row; /* Изменяем направление на горизонтальное */
            justify-content: flex-end; /* Выравниваем по правому краю */
            align-items: flex-end; /* Выравниваем по нижнему краю */
            height: 100vh;
        }

        .block {
            width: 100px; /* Уменьшаем ширину для горизонтального расположения */
            height: 100px;
            border: 2px solid green;
            margin-left: 20px;
        }
    </style>
</head>
<body>
    <div class="block">1</div>
    <div class="block">2</div>
    <div class="block">3</div>
    <div class="block">4</div>
    <div class="block">5</div>
</body>
</html>
