<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задания по адаптивной верстке</title>
    <style>
        .parent {
            display: flex;
            border: 3px solid red;
            height: 100px;
            margin-bottom: 20px;
        }

        .child {
            border: 2px solid green;
            margin: 5px;
            padding: 10px;
        }

        .justify-center { justify-content: center; }
        .justify-space-between { justify-content: space-between; }
        .justify-space-around { justify-content: space-around; }
        .justify-space-evenly { justify-content: space-evenly; }
        .justify-flex-start { justify-content: flex-start; }
        .justify-flex-end { justify-content: flex-end; }
    </style>
</head>
<body>
    <div class="parent justify-center">
        <div class="child">1</div>
        <div class="child">2</div>
        <div class="child">3</div>
    </div>

    <div class="parent justify-space-between">
        <div class="child">1</div>
        <div class="child">2</div>
        <div class="child">3</div>
    </div>

    <div class="parent justify-space-around">
        <div class="child">1</div>
        <div class="child">2</div>
        <div class="child">3</div>
    </div>

    <div class="parent justify-space-evenly">
        <div class="child">1</div>
        <div class="child">2</div>
        <div class="child">3</div>
    </div>

    <div class="parent justify-flex-start">
        <div class="child">1</div>
        <div class="child">2</div>
        <div class="child">3</div>
    </div>

    <div class="parent justify-flex-end">
        <div class="child">1</div>
        <div class="child">2</div>
        <div class="child">3</div>
    </div>
</body>
</html>
